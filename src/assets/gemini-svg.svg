<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <!-- Gradientes corporativos -->
    <linearGradient id="sc360-green-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="sc360-orbit" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ISOTIPO (Escudo 360) -->
  <g transform="translate(20, 10)">
    <!-- Escudo / Base Industrial -->
    <path d="M 80 25 L 128 45 V 105 C 128 138 80 160 80 160 C 80 160 32 138 32 105 V 45 Z" 
          fill="none" stroke="url(#sc360-green-blue)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Anillo Orbital 360 -->
    <ellipse cx="80" cy="92" rx="68" ry="24" 
             fill="none" stroke="url(#sc360-orbit)" stroke-width="7" 
             stroke-dasharray="290" stroke-dashoffset="40"
             transform="rotate(-22 80 92)" stroke-linecap="round"/>

    <!-- Nodo de Control -->
    <circle cx="132" cy="62" r="7" fill="#00E676" filter="url(#glow-green)"/>

    <!-- Icono Checkmark Interno -->
    <path d="M 62 92 L 74 104 L 98 80" 
          fill="none" stroke="#00C853" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- LOGOTIPO (Texto) -->
  <g transform="translate(180, 55)">
    <!-- SANO CONTROL -->
    <text x="0" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#1A237E" letter-spacing="1">
      SANO<tspan fill="#00C853">CONTROL</tspan>
    </text>

    <!-- 360 ERP SYSTEM -->
    <text x="2" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#0288D1" letter-spacing="7">
      360 <tspan fill="#607D8B" font-weight="500" letter-spacing="3">| ERP SYSTEM</tspan>
    </text>
  </g>
</svg>
